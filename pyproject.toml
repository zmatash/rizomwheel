[project]
name = "rizomwheel"
version = "0.1.0"
description = "Builds a wheel from the latest RizomUVLink source"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["build>=1.2"]

[project.scripts]
rizomwheel = "rizomwheel:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
py-modules = ["rizomwheel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
